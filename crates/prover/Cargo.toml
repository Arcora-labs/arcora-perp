[package]
name = "prover"
description = "Proving harness for dark-perp: the public-input binding a ZK batch proof commits to, a pluggable Prover/Verifier, and the §10b attested confidential-proving boundary (sealed witness, measurement-gated, zeroized after use). The guest program is the perp-core engine itself."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
hex = "0.4"
perp-core = { path = "../perp-core", features = ["serde"] }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
