[package]
name = "prover-service"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
prover = { path = "../prover" }
perp-core = { path = "../perp-core", features = ["serde"] }
sp1-sdk = "6.0.0"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
postcard = { version = "1", features = ["alloc"] }

[build-dependencies]
sp1-build = "6.0.0"

# standalone: not part of the host workspace
[workspace]
