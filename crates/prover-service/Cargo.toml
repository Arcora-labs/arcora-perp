[package]
name = "prover-service"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
prover = { path = "../prover" }
perp-core = { path = "../perp-core", features = ["serde"] }
# SEC-020 Task 4: the mutual-attestation handshake — Attestor backends
# (AzureTdxAttestor to verify the gateway, NvidiaCcAttestor for our self-quote)
# + the pure session secret/token math shared with the gateway.
dark-perp-attestation = { path = "../attestation" }
sp1-sdk = "=6.0.0"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
postcard = { version = "1", features = ["alloc"] }
# SEC-020 Task 4: fresh per-boot handshake nonce from the OS CSPRNG.
getrandom = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"

[build-dependencies]
sp1-build = "=6.0.0"

# standalone: not part of the host workspace
[workspace]
