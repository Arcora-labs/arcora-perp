[package]
name = "matcher"
description = "Deterministic price-time-priority continuous CLOB for dark-perp (Phase 1 hot path). Produces matched fills consumed by perp-core's settlement engine and the basis for Proof-v2 matching determinism."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
std = ["perp-core/std"]
# (De)Serialize on the book state so the gateway can persist it in the sealed
# state snapshot. Purely additive; default off (mirrors perp-core's gate).
serde = ["dep:serde", "perp-core/serde"]

[dependencies]
perp-core = { path = "../perp-core", default-features = false }
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }
