[package]
name = "dark-perp-attestation"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Offline TDX DCAP quote verification through the supported ring backend.
# The rustcrypto backend pulls in rsa (RUSTSEC-2023-0071); disable it rather than
# suppressing its advisory. `report` stays disabled: collateral is always pinned.
dcap-qvl = { version = "0.5.2", default-features = false, features = ["std", "ring", "default-x509"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Keccak256 + the `Measurement` domain tag, to fold the 48-byte MRTD into the
# engine's 32-byte measurement `Digest`.
perp-core = { path = "../perp-core" }
# Azure vTPM trust-chain verification (#5b): SHA-256 (HCL runtime-data binding +
# PCR digest), RSA RSASSA-PKCS1v1.5 (the vTPM AK signature over the TPM quote),
# and base64url (the AK pubkey n/e in the HCL runtime-data JSON). Public-key
# verification only; no RSA private-key operations or custom unsafe code.
ring = "0.17.14"
sha2 = "0.10"
base64 = "0.22"
# SEC-020 handshake: hex-encode the session token (also used by the tests).
hex = "0.4"
# SEC-020 Phase-2 (C3): ephemeral x25519 for the DH-bound session secret — the
# same crate family as sealed-box; required erasure is explicit here.
# Enable erasing Drop explicitly; disabled defaults otherwise remove it.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", default-features = false }
