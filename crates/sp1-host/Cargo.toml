# SP1 host that EXECUTES the perp-core zkVM guest and checks its committed public
# value equals the native perp-core commitment byte-for-byte. Standalone (heavy
# sp1-sdk dep, not run in CI); excluded from the host workspace. Build the guest
# first (`cd ../sp1-guest && cargo prove build`), then
# `cargo run --release --bin sp1-host` here (`--bin` is required: this crate has
# two bin targets — `sp1-host` and `prove` — and no `default-run`, so a bare
# `cargo run` errors). Run with SP1_SKIP_PROGRAM_BUILD unset, or build.rs skips
# the guest build the parity check depends on.
[package]
name = "sp1-host"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
bincode = "1.3.3"
sp1-verifier = "=6.1.0"
prover = { path = "../prover" }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sp1-sdk = "=6.1.0"
tokio = { version = "1", features = ["full"] }
perp-core = { path = "../perp-core", features = ["serde"] }
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
sp1-build = "=6.1.0"

[workspace]

# Use the manifest-only LRU dependency correction; see vendor provenance.
[patch.crates-io]
sp1-prover = { path = "../../vendor/sp1-prover" }
