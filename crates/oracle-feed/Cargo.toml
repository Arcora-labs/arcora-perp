[package]
name = "oracle-feed"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `http` pulls a blocking client (native-tls → trusts the system/proxy CA) so the
# adapter can fetch live; default-off keeps the core build and CI dependency-light.
default = []
http = ["dep:ureq", "dep:serde_json"]

[dependencies]
perp-core = { path = "../perp-core" }
# ZK-001 (Task 5): host-side publisher signing key. `oracle-feed` is not the guest,
# so `std` / default features are fine (the guest re-verifies via perp-core's no_std
# k256). Must resolve to the SAME k256 0.13 as perp-core so `SigningKey`/`OracleSig`
# are one type across the crates (cargo unifies to the union of features).
k256 = { version = "0.13", features = ["ecdsa"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"], optional = true }
serde_json = { version = "1", optional = true }

# Live probe: prints an OracleTranscript per market from the real Crypto.com feed.
# Requires the `http` feature: cargo run -p oracle-feed --features http --bin probe
[[bin]]
name = "probe"
required-features = ["http"]
