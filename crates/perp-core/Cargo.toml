[package]
name = "perp-core"
description = "Deterministic, no_std-friendly state-transition core for the dark-perp protocol (Phase 0). Runs natively in the sequencer and unmodified inside a zkVM guest."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# `std` is on by default for native builds (sequencer, tests, benches).
# Disable it (`--no-default-features`) to build the same logic for a zkVM guest.
default = ["std"]
std = []
# `serde` enables (De)Serialize on the public types so a witness (state + ops)
# can be encoded for the prover (the documented prerequisite for the real zkVM
# guest, docs/PROVING.md). Purely additive; default off.
serde = ["dep:serde"]

[dependencies]
tiny-keccak = { version = "2", features = ["keccak"] }
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }
# ZK-001: recoverable-ECDSA over the oracle-attestation digest, verified IN the
# guest. `default-features = false` (no `std`) is mandatory — this crate is
# re-run unmodified inside the no_std zkVM guest; the `ecdsa` feature carries the
# verify-only `recover_from_prehash` path (no RNG) the guest needs.
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

[dev-dependencies]
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# ZK-001: integration tests build a publisher `SigningKey` to sign the oracle
# transcripts they feed the engine, so they exercise the REAL fail-closed signature
# gate (a test crate can't reach the library's own non-dev dependency).
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
