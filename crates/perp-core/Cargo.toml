[package]
name = "perp-core"
description = "Deterministic, no_std-friendly state-transition core for the dark-perp protocol (Phase 0). Runs natively in the sequencer and unmodified inside a zkVM guest."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# `std` is on by default for native builds (sequencer, tests, benches).
# Disable it (`--no-default-features`) to build the same logic for a zkVM guest.
default = ["std"]
std = []

[dependencies]
tiny-keccak = { version = "2", features = ["keccak"] }

[dev-dependencies]
