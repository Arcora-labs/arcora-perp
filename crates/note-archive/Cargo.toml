[package]
name = "note-archive"
description = "Encrypted note ciphertext archive + view-key scanning (§7). Recovers shielded collateral notes from a seed after device loss — the mandatory anti-Schrödinger-position component."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
std = ["perp-core/std"]
# (De)Serialize on the archive + wallet so the gateway can persist them in the
# sealed state snapshot. Purely additive; default off (mirrors perp-core's gate).
serde = ["dep:serde", "perp-core/serde"]

[dependencies]
perp-core = { path = "../perp-core", default-features = false }
sealed-box = { path = "../sealed-box", default-features = false }
# Trait bounds only (RngCore + CryptoRng) — the rng is THREADED in by callers, so
# the no_std lib path never pulls in getrandom/std. Tests use OsRng via dev-deps.
rand_core = { version = "0.6", default-features = false }
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
