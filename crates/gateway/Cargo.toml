[package]
name = "gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
perp-core = { path = "../perp-core", features = ["serde"] }
sequencer = { path = "../sequencer" }
# Slice 3b-2b: SealedWitness + SoftwareSealProvider to seal the window witness for the
# prover-service. Workspace-internal — does NOT pull in sp1-sdk (that's prover-service only).
prover = { path = "../prover" }
note-archive = { path = "../note-archive", features = ["std", "serde"] }
sealed-box = { path = "../sealed-box", default-features = false }
dark-perp-attestation = { path = "../attestation" }
oracle-feed = { path = "../oracle-feed", features = ["http"] }

axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
# raw keccak for the withdrawals Merkle tree (must match MerkleLib.sol) and
# secp256k1 recovery for caller-signed orders (matches the contract's ecrecover).
sha3 = "0.10"
# Startup restore checkpoint; same SHA-256 release already present in Cargo.lock.
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
# audit DP-013: encrypt the L1 sequencer key into a V3 keystore in-process so the raw key
# never appears in a `cast` argv (it is fed via --keystore + --password-file instead).
eth-keystore = "0.5"
rand = "0.8"
# compact binary encoding for the sealed state snapshot (persistence across
# restarts) — the same codec the prover witness already round-trips.
postcard = { version = "1", features = ["alloc", "use-std"] }

[dev-dependencies]
# router-level tests drive `build_router` via `ServiceExt::oneshot` (audit DP-010).
tower = { version = "0.5", features = ["util"] }
# SEC-025-A Task 1: `start_paused` for the snapshot-ack timeout test, so the full
# SNAPSHOT_ACK_TIMEOUT_SECS elapses on the virtual clock instead of a real sleep.
# Test-target only — the production bin's tokio feature set is unchanged.
tokio = { version = "1", features = ["test-util"] }
# S1: real-socket /v1/ws tests (session revocation after API-key rotation).
tokio-tungstenite = "0.24"
futures-util = "0.3"
