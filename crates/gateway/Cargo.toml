[package]
name = "gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
perp-core = { path = "../perp-core" }
sequencer = { path = "../sequencer" }
note-archive = { path = "../note-archive", features = ["std"] }
dark-perp-attestation = { path = "../attestation" }
oracle-feed = { path = "../oracle-feed", features = ["http"] }

axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
# raw keccak for the withdrawals Merkle tree (must match MerkleLib.sol) and
# secp256k1 recovery for caller-signed orders (matches the contract's ecrecover).
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
# audit DP-013: encrypt the L1 sequencer key into a V3 keystore in-process so the raw key
# never appears in a `cast` argv (it is fed via --keystore + --password-file instead).
eth-keystore = "0.5"
rand = "0.8"

[dev-dependencies]
# router-level tests drive `build_router` via `ServiceExt::oneshot` (audit DP-010).
tower = { version = "0.5", features = ["util"] }
