[workspace]
resolver = "2"
members = [
    "crates/perp-core",
    "crates/matcher",
    "crates/sequencer",
    "crates/prover",
    "crates/note-archive",
    "crates/committee",
    "crates/bridge",
    "crates/e2e",
    "crates/demo",
    "crates/loadbot",
    "crates/oracle-feed",
    "crates/node",
    "crates/gateway",
    "crates/attestation",
    "crates/sealed-box",
]
# The SP1 zkVM guest is built only by `cargo prove` for the riscv32im target (it
# depends on sp1-zkvm and has no host build), so it is excluded from the host
# workspace — `cargo build --workspace` and CI never try to compile it. sp1-host
# and prover-service both pull in the heavy sp1-sdk (Groth16/Docker/gnark) and are
# standalone `[workspace]`s built only on the SP1-capable prover machine.
# The Chainlink candidate crates are also standalone `[workspace]`s (host-only;
# not host-workspace members), but the gateway's opt-in candidate archive binding
# path-depends on them — excluding them here is what lets a member path-depend on
# an in-tree crate that keeps its own workspace root. No versions or pins change.
exclude = ["crates/sp1-guest", "crates/sp1-host", "crates/prover-service", "vendor/dcap-qvl-webpki",
    "crates/chainlink-oracle", "crates/chainlink-streams-client"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["dark-perp contributors"]
repository = "https://github.com/kubudak90/dark-perp"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1

# Manifest-only fix for unused weak RSA dependencies; see vendor provenance.
[patch.crates-io]
dcap-qvl-webpki = { path = "vendor/dcap-qvl-webpki" }
