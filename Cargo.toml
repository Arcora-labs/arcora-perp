[workspace]
resolver = "2"
members = [
    "crates/perp-core",
    "crates/matcher",
    "crates/sequencer",
    "crates/prover",
    "crates/note-archive",
    "crates/committee",
    "crates/bridge",
    "crates/e2e",
    "crates/demo",
    "crates/loadbot",
]
# The SP1 zkVM guest is built only by `cargo prove` for the riscv32im target (it
# depends on sp1-zkvm and has no host build), so it is excluded from the host
# workspace — `cargo build --workspace` and CI never try to compile it.
exclude = ["crates/sp1-guest"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["dark-perp contributors"]
repository = "https://github.com/kubudak90/dark-perp"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
