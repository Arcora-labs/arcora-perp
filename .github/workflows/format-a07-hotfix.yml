name: Format A07 hotfix
on:
  push:
    branches: ['fix/a07-recovery-ui-hotfix-2026-09-19']
    paths: ['.github/workflows/format-a07-hotfix.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates
          git rm .github/workflows/format-a07-hotfix.yml
          git commit -m 'style(a07): format recovery module'
          git push
