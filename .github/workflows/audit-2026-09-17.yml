name: Audit reproductions (2026-09-17 baseline)

on:
  pull_request:
    paths:
      - 'scripts/audit/2026-09-17/**'
      - '.github/workflows/audit-2026-09-17.yml'

permissions:
  contents: read

jobs:
  gateway-reproductions:
    name: Known-bad baseline characterization (NOT fixes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Reproduce eight findings against the pinned source
        run: python3 scripts/audit/2026-09-17/run.py
      - name: Retain exact logs and source identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-2026-09-17-evidence
          path: target/audit-2026-09-17-evidence/
          if-no-files-found: error
          retention-days: 14
