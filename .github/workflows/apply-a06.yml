name: Apply verified A06 patch
on:
  push:
    branches: ['fix/a06-close-only-exit-2026-09-18']
    paths: ['.github/a06-patch/05']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a06-close-only-exit-2026-09-18
          fetch-depth: 0
      - name: Reconstruct and apply locally verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/a06-patch/0{0,1,2,3,4,5} > /tmp/a06.b64
          base64 -d /tmp/a06.b64 | xz -d > /tmp/a06.patch
          echo '622def270f344cf7e159b98880d495b65e77298f8ba0a1dcabe902eb831769c6  /tmp/a06.patch' | sha256sum -c -
          git apply --check /tmp/a06.patch
          git apply /tmp/a06.patch
          git rm -r .github/a06-patch .github/workflows/apply-a06.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts crates docs
          git commit -m 'fix(a06): add proof-bound counterparty-free CloseOnly exit'
          git push origin HEAD:fix/a06-close-only-exit-2026-09-18
