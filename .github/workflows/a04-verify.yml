name: A04 cancellation verification
on:
  push:
    branches: [fix/a04-cancellation-verified-2026-09-18]
permissions:
  contents: read
concurrency:
  group: a04-cancellation-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: '2'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
      CARGO_TERM_COLOR: never
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Materialize checksum-locked candidate and live-history hardening
        run: python3 .remediation-a04/prepare.py
      - name: Run full verification and two executed negative controls
        run: python3 -u .remediation-a04/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a04-verification-${{ github.run_id }}
          path: a04-evidence/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a04-cancellation-verified-2026-09-18
      - uses: actions/download-artifact@v4
        with:
          name: a04-verification-${{ github.run_id }}
          path: /tmp/a04-evidence
      - name: Publish verified source to the fix branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path('/tmp/a04-evidence')
          report = json.loads((out / 'status.json').read_text())
          assert report['complete'] and report['all_passed'] and report['workflow_head'] == os.environ['EXPECTED_HEAD']
          patch = (out / 'verified.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == report['verified_patch_sha256']
          expected = {'crates/gateway/src/audit_cancellation_tests.rs', 'crates/gateway/src/main.rs', 'crates/matcher/src/book.rs', 'crates/sequencer/src/cancellation.rs', 'crates/sequencer/src/cancellation/tests.rs', 'crates/sequencer/src/lib.rs', 'frontend/src/api/clientContract.test.ts', 'frontend/src/api/mockClient.ts', 'frontend/src/api/realClient.test.ts', 'frontend/src/api/realClient.ts', 'frontend/src/components/Tables.tsx', 'frontend/src/components/demoGates.test.tsx', 'frontend/src/domain/cancellation.ts', 'frontend/src/domain/types.ts', 'docs/API.md'}
          assert set(report['source_files']) == expected
          subprocess.run(['git', 'apply', '--check', str(out / 'verified.patch')], check=True)
          subprocess.run(['git', 'apply', '--index', str(out / 'verified.patch')], check=True)
          for path, info in report['source_files'].items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == info['sha256'], path
          pathlib.Path('docs/audits/2026-09-18-a04-verification.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
          git rm .remediation-a04/part1.b64 .remediation-a04/part2.b64 .remediation-a04/part3.b64 .remediation-a04/prepare.py .remediation-a04/verify.py .github/workflows/a04-verify.yml
          git add docs/audits/2026-09-18-a04-verification.json
          git diff --cached --check
          git config user.name Kubudak90
          git config user.email 95706654+Kubudak90@users.noreply.github.com
          git commit -m 'fix(a04): verified durable remainder cancellation and live-maker history retention'
          git push origin HEAD:refs/heads/fix/a04-cancellation-verified-2026-09-18
