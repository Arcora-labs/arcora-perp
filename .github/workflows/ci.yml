name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: witness serialization (serde feature)
        run: cargo test -p perp-core --features serde --locked
      - name: zkVM-guest builds (no_std, incl. serde witness)
        run: |
          cargo build -p perp-core --no-default-features --locked
          cargo build -p perp-core --no-default-features --features serde --locked
          cargo build -p matcher --no-default-features --locked
          cargo build -p note-archive --no-default-features --locked
          cargo build -p bridge --no-default-features --locked

  excluded-crates-typecheck:
    # crates/sp1-host and crates/prover-service are excluded from the workspace
    # (Cargo.toml) because they pull sp1-sdk — Groth16, Docker, gnark — which must
    # not enter `cargo build --workspace`. That exclusion also means CI never
    # compiled them, so they silently rotted against perp-core: all three of their
    # binaries were still constructing the pre-SEC-019 four-field BatchOp::Deposit
    # and had not compiled since. `cargo check` type-checks against the real
    # perp-core path dependency without linking or proving, which is exactly the
    # coverage needed to catch a changed op shape.
    #
    # Three harness steps make the check runnable off the prover box:
    #   - protoc: sp1-prover-types' build script generates protobuf bindings.
    #   - SP1_SKIP_PROGRAM_BUILD: both crates' build.rs would otherwise compile the
    #     SP1 guest, which needs the succinct toolchain (`cargo prove`).
    #   - stub ELF: `include_elf!` is an `include_bytes!` of the path sp1-build
    #     emits even when skipped, so the file must exist. An empty file is fine —
    #     we type-check the host sources, we never execute the guest. The path
    #     comes from sp1-build's HELPER_TARGET_SUBDIR/DEFAULT_TARGET constants; if
    #     an sp1 upgrade moves it, this job fails loudly on the include_bytes.
    name: prover crates (excluded, typecheck)
    runs-on: ubuntu-latest
    # Each excluded application has a reviewed lockfile. Keep the expensive
    # typecheck bounded; this job still does not execute or prove the guest.
    timeout-minutes: 30
    env:
      SP1_SKIP_PROGRAM_BUILD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/sp1-host
            crates/prover-service
      - name: install protoc (sp1-prover-types build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Require the patched coherent SP1 release
        run: python3 scripts/local-verification/check_sp1_release.py
      - name: Regenerate the real SP1 native runner after cache restore
        # SP1 6.1.0 embeds a helper built under its registry source directory.
        # rust-cache restores the outer build-script output, but not that nested
        # binary. Invalidate only this package in each standalone target so the
        # upstream build script rebuilds the real helper before include_bytes!.
        run: |
          cargo clean --locked --manifest-path crates/sp1-host/Cargo.toml --package sp1-core-executor-runner
          cargo clean --locked --manifest-path crates/prover-service/Cargo.toml --package sp1-core-executor-runner
      - name: stub the guest ELF (guest build skipped; include_elf! needs the file)
        run: |
          mkdir -p crates/sp1-guest/target/elf-compilation/riscv64im-succinct-zkvm-elf/release
          touch crates/sp1-guest/target/elf-compilation/riscv64im-succinct-zkvm-elf/release/perp-core-guest
      - name: typecheck sp1-host
        run: cargo check --locked --manifest-path crates/sp1-host/Cargo.toml
      - name: typecheck prover-service
        run: cargo check --locked --manifest-path crates/prover-service/Cargo.toml

  contracts:
    name: contracts (foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: build
        run: forge build
      - name: test
        run: forge test -vvv

  frontend:
    name: frontend (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
