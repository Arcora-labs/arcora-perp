name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-lint:
    name: rust (lint, 1.99)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust:
    name: rust (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Independent job: a lint failure must not prevent test execution.
    # The frozen HTTP archive fixture has a real 2-second freshness deadline.
    # Bound scheduling contention; do not loosen report freshness or assertions.
    env:
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cast for localhost L1 fixture tests
        uses: foundry-rs/foundry-toolchain@v1
      - name: test
        run: cargo test --workspace --locked
      - name: witness serialization (serde feature)
        run: cargo test -p perp-core --features serde --locked
      - name: zkVM-guest builds (no_std, incl. serde witness)
        run: |
          cargo build -p perp-core --no-default-features --locked
          cargo build -p perp-core --no-default-features --features serde --locked
          cargo build -p matcher --no-default-features --locked
          cargo build -p note-archive --no-default-features --locked
          cargo build -p bridge --no-default-features --locked

  excluded-crates-typecheck:
    # crates/sp1-host and crates/prover-service are excluded from the workspace
    # (Cargo.toml) because they pull sp1-sdk — Groth16, Docker, gnark — which must
    # not enter `cargo build --workspace`. That exclusion also means CI never
    # compiled them, so they silently rotted against perp-core: all three of their
    # binaries were still constructing the pre-SEC-019 four-field BatchOp::Deposit
    # and had not compiled since. `cargo check` type-checks against the real
    # perp-core path dependency without linking or proving, which is exactly the
    # coverage needed to catch a changed op shape.
    #
    # Three harness steps make the check runnable off the prover box:
    #   - protoc: sp1-prover-types' build script generates protobuf bindings.
    #   - SP1_SKIP_PROGRAM_BUILD: both crates' build.rs would otherwise compile the
    #     SP1 guest, which needs the succinct toolchain (`cargo prove`).
    #   - stub ELF: `include_elf!` is an `include_bytes!` of the path sp1-build
    #     emits even when skipped, so the file must exist. An empty file is fine —
    #     for typechecking. The separate replay steps explicitly load the SHA-pinned
    #     reviewed ELF and execute it; they do not claim a fresh guest build. The path
    #     comes from sp1-build's HELPER_TARGET_SUBDIR/DEFAULT_TARGET constants; if
    #     an sp1 upgrade moves it, this job fails loudly on the include_bytes.
    name: prover crates (excluded, typecheck)
    runs-on: ubuntu-latest
    # Each excluded application has a reviewed lockfile. Keep the expensive
    # typecheck and execution bounded. Guest execution is CPU-only; no proof is generated.
    timeout-minutes: 30
    env:
      SP1_SKIP_PROGRAM_BUILD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/sp1-host
            crates/prover-service
      - name: install protoc (sp1-prover-types build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Require the patched coherent SP1 release
        run: python3 scripts/local-verification/check_sp1_release.py
      - name: Regenerate the real SP1 native runner after cache restore
        # SP1 6.1.0 embeds a helper built under its registry source directory.
        # rust-cache restores the outer build-script output, but not that nested
        # binary. Invalidate only this package in each standalone target so the
        # upstream build script rebuilds the real helper before include_bytes!.
        run: |
          cargo clean --locked --manifest-path crates/sp1-host/Cargo.toml --package sp1-core-executor-runner
          cargo clean --locked --manifest-path crates/prover-service/Cargo.toml --package sp1-core-executor-runner
      - name: stub the guest ELF (guest build skipped; include_elf! needs the file)
        run: |
          mkdir -p crates/sp1-guest/target/elf-compilation/riscv64im-succinct-zkvm-elf/release
          touch crates/sp1-guest/target/elf-compilation/riscv64im-succinct-zkvm-elf/release/perp-core-guest
      - name: typecheck sp1-host
        run: cargo check --locked --manifest-path crates/sp1-host/Cargo.toml
      - name: native host fixture and artifact guards (not guest execution)
        run: cargo test --locked --manifest-path crates/sp1-host/Cargo.toml --lib
      - name: typecheck prover-service
        run: cargo check --locked --manifest-path crates/prover-service/Cargo.toml
      # The four reviewed witnesses execute about 98 million guest cycles.
      # Optimize the host executor so debug-mode overhead does not dominate CI.
      # clock-proof requires --elf and refuses an ELF whose SHA-256 is not the
      # reviewed pin. vkey prints the setup key of the ELF given with --elf (or of
      # the embedded build-script ELF, a stub here) and enforces no pin; compare its
      # ELF_SHA256 line with REVIEWED_GUEST. Building both keeps them compiling.
      - name: Build optimized exact synthetic funds replay host (guest build skipped)
        env:
          CARGO_BUILD_JOBS: '2'
        run: cargo build --release --locked --manifest-path crates/sp1-host/Cargo.toml --bin replay-funds --bin vkey --bin clock-proof
      - name: Reject incomplete or substituted normal-wallet witnesses
        run: |
          python3 scripts/local-verification/verify_funds_replay.py \
            --binary crates/sp1-host/target/release/replay-funds \
            --elf contracts/integration/fixtures/clock-v2-verified/guest.elf \
            --witness-dir docs/audits/2026-10-09-followup/clock-lifecycle/witnesses \
            --output-dir /tmp/arcora-funds-replay-guards
      - name: Execute reviewed SP1 guest on all four exact wallet witnesses (not proof generation)
        env:
          RAYON_NUM_THREADS: '2'
        run: |
          crates/sp1-host/target/release/replay-funds \
            docs/audits/2026-10-09-followup/clock-lifecycle/witnesses \
            /tmp/arcora-funds-guest-execution \
            --elf contracts/integration/fixtures/clock-v2-verified/guest.elf
      # The frozen Chainlink candidate lane (its ELF, setup key, fixtures and
      # chainlink-oracle sources stay byte-identical history) is checked in
      # chainlink-candidate.yml, outside this required job.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-funds-guest-replay
          path: |
            /tmp/arcora-funds-replay-guards
            /tmp/arcora-funds-guest-execution

  reviewed-guest-execution:
    # The committed reviewed guest ELF (REVIEWED_GUEST["identity_dir"]) executed on
    # CPU: its setup key, its normal fixture, every case witness and every negative
    # must reproduce the REVIEWED_GUEST and REVIEWED_FIXTURE pins in
    # scripts/local-verification/verify_clock_proof.py. The checker also requires
    # the checkout's guest sources to be REVIEWED_GUEST's. No proof is generated,
    # and no ELF comes from a build script (that guest build is skipped and stubbed).
    name: reviewed guest execution (CPU)
    runs-on: ubuntu-latest
    # Its own budget: an optimized sp1-host build, a CPU setup-key derivation and
    # guest execution of the fixture, the cases and the negatives.
    timeout-minutes: 60
    env:
      SP1_SKIP_PROGRAM_BUILD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/sp1-host
      - name: install protoc (sp1-prover-types build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Require the patched coherent SP1 release
        run: python3 scripts/local-verification/check_sp1_release.py
      - name: Regenerate the real SP1 native runner after cache restore
        run: cargo clean --locked --manifest-path crates/sp1-host/Cargo.toml --package sp1-core-executor-runner
      - name: stub the build-script guest ELF (vkey's include_elf! fallback; never executed here)
        run: |
          mkdir -p crates/sp1-guest/target/elf-compilation/riscv64im-succinct-zkvm-elf/release
          touch crates/sp1-guest/target/elf-compilation/riscv64im-succinct-zkvm-elf/release/perp-core-guest
      - name: Build the vkey and clock-proof hosts (guest build skipped)
        env:
          CARGO_BUILD_JOBS: '2'
        run: cargo build --release --locked --manifest-path crates/sp1-host/Cargo.toml --bin vkey --bin clock-proof
      - name: Derive the setup key and execute the fixture, cases and negatives (not proof generation)
        env:
          RAYON_NUM_THREADS: '2'
        run: |
          python3 scripts/local-verification/check_reviewed_guest_execution.py \
            --vkey-bin crates/sp1-host/target/release/vkey \
            --clock-proof-bin crates/sp1-host/target/release/clock-proof \
            --output-dir "$RUNNER_TEMP/arcora-reviewed-guest-execution"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-guest-execution
          path: ${{ runner.temp }}/arcora-reviewed-guest-execution

  contracts:
    name: contracts (foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: build
        run: forge build
      - name: test
        run: forge test -vvv
      - name: Experimental batch clock anchor (not production integration)
        run: forge test --root experimental/batch-clock -vv

  frontend:
    name: frontend (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
