name: a01-work
on:
  push:
    branches: [fix/a01-ordered-deposits-2026-09-18]
    paths: [.github/workflows/a01-work.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: 2
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: true
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Verify final published source and isolated negative controls
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,subprocess,os,json,tarfile,shutil,re
          root=pathlib.Path.cwd();ev=root/'evidence';ev.mkdir(exist_ok=True)
          base='48e03ac3db123cdf159c10f1e0c86262043a377e';a04='9cc31baa49e1da08bb4a018279e7bb3b7bc67b40'
          work=root.parent/'a01-candidate';subprocess.run(['git','worktree','add','--detach',str(work),os.environ['GITHUB_SHA']],check=True)
          os.environ['CARGO_TARGET_DIR']=str(root/'target');results=[]
          def run(name,cmd,cwd=work,negative=False):
              with (ev/(name+'.log')).open('w') as f:p=subprocess.run(cmd,cwd=cwd,stdout=f,stderr=subprocess.STDOUT)
              text=(ev/(name+'.log')).read_text();ok=p.returncode==0
              if negative:ok=p.returncode==101 and 'test result: FAILED. 0 passed; 1 failed;' in text and 'assertion' in text
              row=dict(name=name,command=cmd,exit_code=p.returncode,expected_failure=negative,passed=ok)
              counts=re.findall(r'test result: .*? (\d+) passed; (\d+) failed; (\d+) ignored;',text)
              if counts:row['rust_test_counts']={k:sum(int(t[i]) for t in counts) for i,k in enumerate(['passed','failed','ignored'])}
              results.append(row);(ev/'results.json').write_text(json.dumps(results,indent=2));print(name,p.returncode,ok,flush=True)
              if not ok:print(text[-16000:],flush=True)
              return ok
          subprocess.run(['python3',str(root/'scripts/audit/a01-work/ui-final.py'),str(work)],check=True)
          run('format-check',['cargo','fmt','--all','--check'])
          run('clippy',['cargo','clippy','--workspace','--all-targets','--locked','--','-D','warnings'])
          run('rust-workspace',['cargo','test','--workspace','--locked'])
          run('native-rpc',['cargo','test','--locked','-p','gateway','a01_native_cast_hash_pinned_jsonrpc_roundtrip','--','--ignored','--nocapture'])
          run('core-serde',['cargo','test','--locked','-p','perp-core','--features','serde'])
          run('core-no-std',['cargo','build','--locked','-p','perp-core','--no-default-features'])
          if run('pnpm-install',['pnpm','install','--frozen-lockfile'],work/'frontend'):
              run('frontend-tests',['pnpm','test'],work/'frontend');run('frontend-build',['pnpm','build'],work/'frontend')
          run('foundry',['forge','test','-v'],work/'contracts')
          protected=['crates/perp-core','contracts','tests/fixtures','crates/prover/tests/vectors.rs','crates/sealed-box/tests/vectors.rs']
          run('protected-commitment-vectors',['git','diff','--exit-code',base,'--',*protected])
          # Demonstrate that the regression tests detect the original failure classes.
          seq=work/'crates/sequencer/src/lib.rs';original=seq.read_text()
          begin=original.index('    pub fn apply_atomic(');end=original.index('\n    ///',begin)
          part=original[begin:end];assert 'next.apply_op(op)?;' in part
          seq.write_text(original[:begin]+part.replace('next.apply_op(op)?;','self.state.apply_op(op)?;')+original[end:])
          run('negative-partial-credit',['cargo','test','--locked','-p','gateway','a01_atomic_second_funding_failure_preserves_every_account_and_replay_op'],negative=True)
          seq.write_text(original)
          ing=work/'crates/gateway/src/deposit_ingestion.rs';original=ing.read_text();assert original.count('match route.purpose {')==1
          ing.write_text(original.replace('match route.purpose {','match Purpose::Collateral {'))
          run('negative-insurance-diversion',['cargo','test','--locked','-p','gateway','a01_insurance_is_never_user_collateral'],negative=True)
          ing.write_text(original)
          shutil.rmtree(work/'scripts/audit/a01-work');(work/'.github/workflows/a01-work.yml').unlink()
          subprocess.run(['git','add','-A'],cwd=work,check=True)
          patch=subprocess.check_output(['git','diff','--cached',base,'--binary'],cwd=work);(ev/'formatted.patch').write_bytes(patch)
          paths=subprocess.check_output(['git','diff','--cached',base,'--name-only','--diff-filter=ACM'],cwd=work).decode().splitlines()
          with tarfile.open(ev/'candidate.tar.gz','w:gz') as tar:
              for path in paths:tar.add(work/path,arcname=path)
          info={'base':base,'a04_head':a04,'workflow_commit':os.environ['GITHUB_SHA'],'patch_sha256':hashlib.sha256(patch).hexdigest(),
                'files':{p:hashlib.sha256((work/p).read_bytes()).hexdigest() for p in paths},
                'rustc':subprocess.check_output(['rustc','--version']).decode().strip(),
                'node':subprocess.check_output(['node','--version']).decode().strip(),
                'pnpm':subprocess.check_output(['pnpm','--version']).decode().strip(),
                'cast':subprocess.check_output(['cast','--version']).decode().strip()}
          (ev/'source.json').write_text(json.dumps(info,indent=2))
          compat=root.parent/'a01-a04-compat';subprocess.run(['git','worktree','add','--detach',str(compat),a04],check=True)
          if run('a04-apply',['git','apply','--3way',str(ev/'formatted.patch')],compat):
              run('a04-rust',['cargo','test','--locked','-p','gateway','-p','sequencer'],compat)
              if run('a04-pnpm-install',['pnpm','install','--offline','--frozen-lockfile'],compat/'frontend'):
                  run('a04-frontend',['pnpm','test'],compat/'frontend')
          if all(r['passed'] for r in results):(ev/'verified').write_text('1')
          raise SystemExit(not all(r['passed'] for r in results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a01-final-evidence
          path: evidence
          retention-days: 30
  publish-candidate:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a01-ordered-deposits-2026-09-18
      - uses: actions/download-artifact@v4
        with:
          name: a01-final-evidence
          path: evidence
      - name: Commit verified source and remove temporary helpers; no merge or deployment
        run: |
          test -f evidence/verified
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          info=json.loads(pathlib.Path('evidence/source.json').read_text())
          with tarfile.open('evidence/candidate.tar.gz') as tar:
              for item in tar:
                  assert item.isfile() and item.name in info['files']
                  data=tar.extractfile(item).read();assert hashlib.sha256(data).hexdigest()==info['files'][item.name]
                  dest=pathlib.Path(item.name);assert '..' not in dest.parts and not dest.is_absolute()
                  dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
          PY
          git add crates frontend docs/API.md .github/workflows/a01-ingestion.yml
          git rm -r scripts/audit/a01-work .github/workflows/a01-work.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(a01): verify autonomous deposits and clean temporary test transport'
          git push origin HEAD:refs/heads/fix/a01-ordered-deposits-2026-09-18
