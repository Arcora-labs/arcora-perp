name: A11 release evidence
on:
  push:
    branches: ['fix/a11-release-evidence-2026-09-18']
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - scripts/local-verification/**
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - crates/sp1-guest/**
      - crates/sp1-host/**
      - crates/prover-service/**
      - contracts/**
      - .github/workflows/a11-release-evidence.yml
permissions:
  contents: read
jobs:
  dependency-audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: RustSec workspace lock
        run: |
          set -o pipefail
          cargo audit --json | tee cargo-audit.json
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: npm advisories through frozen pnpm graph
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile
          pnpm audit --prod --json | tee ../pnpm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11-dependency-audits
          path: |
            cargo-audit.json
            pnpm-audit.json
  release-regression:
    name: release regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check release profile flags take effect
        run: python3 scripts/local-verification/check_release_profile.py
      - name: release workspace tests
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: 'true'
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: 'true'
        run: cargo test --workspace --locked --release
      - run: cargo build -p perp-core --no-default-features --features serde --locked
      - run: cargo build -p matcher --no-default-features --locked
  contracts:
    name: foundry release gate
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: forge test -vvv
  frontend:
    name: frontend release gate
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
  prover-source-binding:
    name: prover source / deployment binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record guest inputs and deployment pin
        shell: bash
        run: |
          set -euo pipefail
          sha256sum crates/sp1-guest/Cargo.toml crates/sp1-guest/src/main.rs crates/perp-core/src/*.rs Cargo.lock > a11-source-hashes.txt
          python3 - <<'PY' > a11-deployment-pin.json
          import json
          from pathlib import Path
          d=json.loads(Path("contracts/deployments/base-sepolia.json").read_text())
          v=d["contracts"]["SP1ZkVerifier"]
          print(json.dumps({"network":d["network"],"chainId":d["chainId"],"verifier":v["address"],"programVKey":v["programVKey"],"deploymentRecordOnly":True},indent=2))
          PY
          cat a11-deployment-pin.json
      - name: Explain non-proof
        run: |
          cat > a11-limitations.txt <<'EOF'
          This CI job does NOT build the SP1 guest ELF, derive its vkey, generate a Groth16 proof,
          query the live chain, or prove that the deployment record matches the current source.
          A06 changed the guest semantics after the recorded July deployment. Mainnet/redeployment
          remains blocked until an SP1-capable release runner rebuilds the ELF, executes native/guest
          parity, derives the program vkey, produces and verifies a real proof, and compares the
          deployed verifier/vkey using pinned chain data.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: a11-source-deployment-binding
          path: |
            a11-source-hashes.txt
            a11-deployment-pin.json
            a11-limitations.txt
