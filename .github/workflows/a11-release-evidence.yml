name: A11 release evidence
on:
  push:
    branches: [main, 'fix/a11-release-evidence-2026-09-18']
  # Every PR must emit these required checks, including documentation-only changes.
  pull_request:
permissions:
  contents: read
jobs:
  dependency-audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: Verify vendored source and patched SP1 release identity
        run: |
          python3 vendor/dcap-qvl-webpki/verify_provenance.py
          python3 vendor/sp1-prover/verify_provenance.py
          python3 scripts/local-verification/check_sp1_release.py
          python3 -m unittest discover -s scripts/local-verification -p test_check_sp1_release.py
          python3 -m unittest discover -s scripts/local-verification -p test_verify_clock_proof.py
      - name: Release manifest and repository protection policy guards
        run: |
          python3 -m unittest discover -s scripts/local-verification -p test_release_manifest.py
          python3 -m unittest discover -s scripts/local-verification -p test_operator_policy.py
          python3 -m unittest discover -s scripts/local-verification -p test_gateway_restore_drill.py
          python3 -m unittest discover -s scripts/local-verification -p test_repository_policy.py
          python3 -m unittest discover -s scripts/local-verification -p test_read_deployment.py
      - name: RustSec workspace and excluded application locks
        run: |
          set -o pipefail
          cargo audit --deny unsound --json | tee cargo-audit.json
          cargo audit --deny unsound --file crates/sp1-host/Cargo.lock --json | tee cargo-audit-host.json
          cargo audit --deny unsound --file crates/sp1-guest/Cargo.lock --json | tee cargo-audit-guest.json
          cargo audit --deny unsound --file crates/prover-service/Cargo.lock --json | tee cargo-audit-prover.json
          cargo audit --deny unsound --file scripts/tee-capture/Cargo.lock --json | tee cargo-audit-tee.json
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: npm advisories through frozen pnpm graph
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile
          pnpm audit --prod --json | tee ../pnpm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11-dependency-audits
          path: |
            cargo-audit.json
            cargo-audit-*.json
            pnpm-audit.json
  release-regression:
    name: release regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check release profile flags take effect
        run: python3 scripts/local-verification/check_release_profile.py
      - name: Install cast for localhost L1 fixture tests
        uses: foundry-rs/foundry-toolchain@v1
      - name: release workspace tests
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: 'true'
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: 'true'
        run: cargo test --workspace --locked --release
      - run: cargo build -p perp-core --no-default-features --features serde --locked
      - run: cargo build -p matcher --no-default-features --locked
  contracts:
    name: foundry release gate
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: forge test -vvv
      - name: Real SP1 verifier guards (no application proof claim)
        working-directory: .
        run: python3 scripts/local-verification/verify_real_proof.py --guards-only --output-dir /tmp/arcora-real-verifier-guards
      - name: Real clock-v2 proof through adapter, settlement and vault
        working-directory: .
        run: |
          python3 -m unittest discover -s scripts/local-verification -p test_verify_clock_proof.py
          python3 scripts/local-verification/verify_clock_fixture.py --output-dir /tmp/arcora-clock-real-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11-clock-real-proof
          path: /tmp/arcora-clock-real-proof
      - name: Reject incomplete or substituted proof artifacts
        working-directory: .
        run: python3 -m unittest discover -s contracts/integration -p 'test_*.py'
      - name: Reject incomplete clock artifacts and changed guest sources
        working-directory: .
        run: python3 -m unittest discover -s scripts/local-verification -p test_verify_clock_proof.py
      - name: Real clock proof through verifier, settlement and vault
        working-directory: .
        run: python3 scripts/local-verification/verify_clock_proof.py --artifact-dir contracts/integration/fixtures/clock-v2-verified --output-dir /tmp/arcora-clock-complete-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11-real-verifier-and-clock-proof
          path: |
            /tmp/arcora-real-verifier-guards
            /tmp/arcora-clock-real-proof
            /tmp/arcora-clock-complete-proof
  gateway-local-drills:
    name: gateway RPC, crash and alert drills
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: Install locked local signing fixture dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build the actual gateway and record its source
        run: python3 scripts/local-verification/run_check.py --output-dir /tmp/arcora-local-drills/checks gateway-build -- cargo build --locked -p gateway
      - name: Public macOS snapshot and journal on Linux recovery code
        run: |
          ARCORA_PAIR_EVIDENCE=/tmp/arcora-local-drills/paired-recovery.json cargo test --locked -p gateway public_macos_pair_restores -- --nocapture
      - name: Local clock wallet lifecycle and gateway-offline claims (explicit mock verifier)
        run: |
          forge build --root contracts
          ARCORA_FUNDS_EVIDENCE=/tmp/arcora-local-drills/funds-lifecycle.json ARCORA_FUNDS_WITNESS_DIR=/tmp/arcora-local-drills/funds-witnesses cargo test -p gateway funds_lifecycle_tests --locked -- --ignored --nocapture
      - name: Release manifest against owned six-contract Anvil stack
        run: |
          forge build --root contracts/vendor/sp1-contracts
          ARCORA_RUN_MANIFEST_ANVIL=1 ARCORA_MANIFEST_ANVIL_EVIDENCE=/tmp/arcora-local-drills/manifest-anvil.json python3 -m unittest discover -s scripts/local-verification -p test_release_manifest.py -v
      - name: Real cast transport against owned RPC fixtures
        run: |
          python3 scripts/local-verification/run_check.py --output-dir /tmp/arcora-local-drills/checks recovery-rpc -- cargo test --locked -p gateway runtime_witness_native_cast -- --ignored --nocapture --test-threads=1
          python3 scripts/local-verification/run_check.py --output-dir /tmp/arcora-local-drills/checks state-rpc -- cargo test --locked -p gateway runtime_state_native_cast -- --ignored --nocapture --test-threads=1
      - name: Clock finality and reorg checks through real cast transport
        run: python3 scripts/local-verification/run_check.py --output-dir /tmp/arcora-local-drills/checks clock-rpc -- cargo test --locked -p gateway runtime_clock_native_cast -- --ignored --nocapture --test-threads=1
      - name: Actual production event paths to a local alert collector
        run: python3 scripts/local-verification/gateway_alert_drill.py --output-dir /tmp/arcora-local-drills/alerts
      - name: Real gateway HTTP ACK, SIGKILL and encrypted restart matrix
        run: python3 scripts/local-verification/gateway_ack_crash_drill.py --gateway-bin target/debug/gateway --output-dir /tmp/arcora-local-drills/ack-crash
      - name: Strict oracle intake through owned HTTP transport
        run: cargo test --locked -p oracle-feed --features http
      - name: Required snapshot restore and fresh-directory recovery drill
        run: python3 scripts/local-verification/gateway_restore_drill.py --gateway-bin target/debug/gateway --output-dir /tmp/arcora-local-drills/restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-local-drills
          path: /tmp/arcora-local-drills
  frontend:
    name: frontend release gate
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
  prover-source-binding:
    name: prover source / deployment binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record guest inputs and deployment pin
        shell: bash
        run: |
          set -euo pipefail
          sha256sum crates/sp1-guest/Cargo.toml crates/sp1-guest/src/main.rs crates/perp-core/src/*.rs Cargo.lock > a11-source-hashes.txt
          python3 - <<'PY' > a11-deployment-pin.json
          import json
          from pathlib import Path
          d=json.loads(Path("contracts/deployments/base-sepolia.json").read_text())
          v=d["contracts"]["SP1ZkVerifier"]
          print(json.dumps({"network":d["network"],"chainId":d["chainId"],"verifier":v["address"],"programVKey":v["programVKey"],"deploymentRecordOnly":True},indent=2))
          PY
          cat a11-deployment-pin.json
      - name: Explain non-proof
        run: |
          cat > a11-limitations.txt <<'EOF'
          This CI job does NOT build the SP1 guest ELF, derive its vkey, generate a Groth16 proof,
          query the live chain, or prove that the deployment record matches the current source.
          PR #31 includes a source-pinned clock guest, native/guest parity and a real proof verified
          by the Rust and Solidity verifiers (checked in the foundry release gate). That evidence
          does not bind the July deployment to the new guest. A target rollout still requires a clean
          reproducible release build, a manifest covering service config and compiled contracts,
          and pinned-chain address, runtime bytecode, program-vkey and state-migration checks.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: a11-source-deployment-binding
          path: |
            a11-source-hashes.txt
            a11-deployment-pin.json
            a11-limitations.txt
