[package]
name = "solana-capped-token"
version = "0.1.0"
edition = "2021"
description = "Experimental capped SPL token mint controller (native Solana program, no Anchor)"
license = "MIT"

[lib]
crate-type = ["lib"]

[dependencies]
solana-program = "=2.3.0"
spl-token = "=6.0.0"

[dev-dependencies]
solana-program-test = "=2.3.13"
solana-sdk = "=2.3.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[workspace]
